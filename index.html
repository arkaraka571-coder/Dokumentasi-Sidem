<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Beach Clean Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh; 
            overflow: hidden;
        }

        .gallery-wrapper {
            width: 100%;
            overflow-x: auto; /* Untuk swipe native di HP */
            overflow-y: hidden;
            position: relative;
            cursor: grab;
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-overflow-scrolling: touch; /* Smooth scroll iOS */
        }

        .gallery-wrapper:active {
            cursor: grabbing;
        }

        /* Sembunyikan scrollbar agar seamless */
        .gallery-wrapper::-webkit-scrollbar { display: none; }
        .gallery-wrapper { -ms-overflow-style: none; scrollbar-width: none; }

        .gallery-track {
            display: flex;
            gap: 15px;
            width: max-content;
            padding: 10px 0;
        }

        .photo-card {
            position: relative;
            width: 320px;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background-color: transparent; 
            box-shadow: none; 
            border: none; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .photo-card:hover {
            transform: scale(1.05);
            z-index: 5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Mencegah drag image bawaan browser */
        }

        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(27, 94, 32, 0.95), rgba(27, 94, 32, 0.5), transparent);
            color: #ffffff;
            padding: 25px 12px 12px;
            font-size: 0.85rem;
            line-height: 1.3;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .photo-card:hover .photo-caption {
            opacity: 1;
            transform: translateY(0);
        }

        /* Lightbox (Full Screen) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 27, 21, 0.97);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 3px solid white;
            object-fit: contain;
        }

        .lightbox-caption {
            color: white;
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .lightbox-source {
            color: #a5d6a7;
            margin-top: 10px;
            font-size: 0.9rem;
            font-style: italic;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #4caf50;
        }

        @media (max-width: 768px) {
            .photo-card { width: 250px; height: 170px; }
            .photo-caption { font-size: 0.75rem; }
            .lightbox-caption { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="gallery-wrapper" id="galleryWrapper">
        <div class="gallery-track" id="galleryTrack"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="">
            <p class="lightbox-caption" id="lightboxCaption"></p>
            <p class="lightbox-source">(Sumber Foto: Dokumentasi WALHI Jatim)</p>
        </div>
    </div>

    <script>
        const photos = [
            {
                url: "https://z-cdn-media.chatglm.cn/files/9afb9375-4cac-4565-8a87-d1a13f61c3a8.jpg?auth_key=1885592913-ff1e0d563a234f75bbf61f52d8462b66-0-50102de3f7df60e5a3de3bee5adc774f",
                desc: "Relawan melakukan pemilahan sampah anorganik hasil dari sepanjang pantai."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/3f35311d-2b56-48c3-a08a-ac3a31d38cb3.jpg?auth_key=1885592913-e52e3394e7f54752befa20733bcbd9a7-0-ae871194473bd43586b18bf81a9ad7ac",
                desc: "Aksi bersih pantai bersama WALHI Jatim, ALWI, PPLH Mangkubumi, Mapala Himalaya, dan LPM Aksara."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/de5112d0-0793-4546-9c82-2901992a6fc7.jpg?auth_key=1885592913-bed34cccd159490daf51dc802770e55a-0-85b0437818a71ed1a837fe06892d1b18",
                desc: "Pengumpulan sampah dari area tepi laut yang terbawa arus Sungai Niyama."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/319e75dc-9750-4605-ac44-9051304bbf4e.jpg?auth_key=1885592913-48cd6cc0158948b883f4e250de9e1c88-0-cc8abe5687ff9ace3b9018d44554eb23",
                desc: "Tumpukan karung berisi sampah siap ditimbang. Total keseluruhan mencapai 252,15 kg."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/c0b78b93-b9a8-4970-ac57-099cebf648d0.jpg?auth_key=1885592913-6734b0cdbd0c498dba7766d20a493609-0-c4b6424f80a3c234aa83e352e3ca8a19",
                desc: "Proses identifikasi merek pada kemasan sachet plastik sekali pakai."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/1a429874-88fb-4dbb-bdba-c48d9f272afb.jpg?auth_key=1885592913-9ffb29d3b21c4a6995e0e21e49b56216-0-113f099bee05bffdd7f07eb006e535b1",
                desc: "Kemasan Pop Mie mendominasi sampah kertas dengan total 54 buah ditemukan."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/d8212bc1-d0fe-4b36-918f-afa282b0e049.jpg?auth_key=1885592913-efc40872a31f4ea7b459071100081b14-0-8323143801eb06ed921d56372e15e626",
                desc: "AMDK merek Club mendominasi gelas sampah minum sekali pakai dengan 101 buah."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/028db4ae-ab50-41d2-8933-fbd38aa43b29.jpg?auth_key=1885592913-6747136180bf420294ff8f29b08057f2-0-312f4ed0c5d555dda0bdb6b6ab82b92d",
                desc: "Relawan lengkap dengan sarung tangan membersihkan sampah dan ranting di pantai."
            },
            {
                url: "https://z-cdn-media.chatglm.cn/files/a56be526-e650-49a4-92ab-8dbe5ecdfd70.jpg?auth_key=1885592913-594edc7745664e9982fcbfc3a4d3f21b-0-15482755d9d7fa57b3c61f1f569a0320",
                desc: "Penimbangan sampah kemasan sachet. Merek Mie Sedap dan Luwak White Coffee paling banyak."
            }
        ];

        const track = document.getElementById('galleryTrack');
        const wrapper = document.getElementById('galleryWrapper');
        
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const closeBtn = document.getElementById('closeBtn');

        function createPhotoCard(photo, isDuplicate = false) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            if (!isDuplicate) {
                card.dataset.url = photo.url;
                card.dataset.desc = photo.desc;
            }

            const img = document.createElement('img');
            img.src = photo.url;
            img.alt = photo.desc;
            img.draggable = false; 

            const caption = document.createElement('div');
            caption.className = 'photo-caption';
            caption.innerText = photo.desc;

            card.appendChild(img);
            card.appendChild(caption);
            return card;
        }

        photos.forEach(photo => track.appendChild(createPhotoCard(photo)));
        photos.forEach(photo => track.appendChild(createPhotoCard(photo, true)));

        // === LOGIKA HIBRIDA (AUTO + MANUAL) ===
        let isPaused = false;
        let resumeTimeout;
        let isMouseDown = false;
        let startX, startScrollLeft;
        let hasDragged = false;

        // 1. Auto Scroll Loop
        function autoScroll() {
            if (!isPaused) {
                wrapper.scrollLeft += 0.5; // Kecepatan geser otomatis
                if (wrapper.scrollLeft >= track.scrollWidth / 2) {
                    wrapper.scrollLeft = 0;
                }
            }
            requestAnimationFrame(autoScroll);
        }
        requestAnimationFrame(autoScroll);

        // Helper Pause/Resume
        function pauseAutoScroll() {
            isPaused = true;
            clearTimeout(resumeTimeout);
        }
        function resumeAutoScroll() {
            // Lanjut otomatis 2.5 detik setelah user berhenti menggeser
            resumeTimeout = setTimeout(() => {
                isPaused = false;
            }, 2500);
        }

        // 2. Desktop Drag (Mouse)
        wrapper.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            hasDragged = false;
            startX = e.pageX;
            startScrollLeft = wrapper.scrollLeft;
            pauseAutoScroll();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            e.preventDefault();
            const walk = (e.pageX - startX) * 1.5;
            if (Math.abs(walk) > 5) hasDragged = true;
            wrapper.scrollLeft = startScrollLeft - walk;
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDown) {
                isMouseDown = false;
                resumeAutoScroll();
            }
        });

        // 3. Mobile Swipe (Native Scroll, hanya deteksi untuk pause)
        let touchStartX = 0;
        wrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].pageX;
            hasDragged = false;
            pauseAutoScroll();
        }, { passive: true });

        wrapper.addEventListener('touchmove', (e) => {
            const walk = e.touches[0].pageX - touchStartX;
            if (Math.abs(walk) > 5) hasDragged = true;
            // Biarkan browser menangani gerakan scrollnya agar mulus (native)
        }, { passive: true });

        wrapper.addEventListener('touchend', () => {
            resumeAutoScroll();
        });

        // === LOGIKA LIGHTBOX (KLIK = FULLSCREEN) ===
        track.addEventListener('click', (e) => {
            // Jangan buka lightbox jika user baru saja nge-drag/swipe
            if (hasDragged) {
                hasDragged = false;
                return;
            }

            const card = e.target.closest('.photo-card');
            if (card && card.dataset.url) {
                lightboxImg.src = card.dataset.url;
                lightboxCaption.innerText = card.dataset.desc;
                lightbox.classList.add('active');
                
                // Paksa masuk mode Fullscreen layar penuh
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(err => console.log("Fullscreen gagal:", err));
                } else if (docEl.webkitRequestFullscreen) { /* Safari */
                    docEl.webkitRequestFullscreen();
                }
            }
        });

        // Fungsi Tutup Lightbox
        const closeLightbox = () => {
            lightbox.classList.remove('active');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        };

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
